# yaml-language-server: $schema=https://www.schemastore.org/pnpm-workspace.json

packages:
  - 'packages/create-vitto'
  - 'packages/vitto-plugin'
  - '!packages/**/template-*'
  - 'website'

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
