# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Publish workflow - Automatically publish packages to npm when a version tag is pushed
# Reference: https://docs.npmjs.com/trusted-publishers
#
# Usage:
#   1. Ensure all changes are committed
#   2. Set version and create tag:
#      VERSION="1.2.3" && git tag "v${VERSION}" && git push origin "v${VERSION}"
#
#   For pre-release versions:
#      VERSION="1.2.3-beta.1" && git tag "v${VERSION}" && git push origin "v${VERSION}"
#
#   To remove an existing tag:
#      VERSION="1.2.3" && git tag -d "v${VERSION}" && git push origin --delete "v${VERSION}"
#
# This workflow will:
#   - Extract version from the tag
#   - Check if version already exists on npm
#   - Sync version across all packages
#   - Build and publish to npm
#   - Create a GitHub release

name: Publish

on:
  push:
    tags:
      - 'v*.*.*' # Push events to matching v*, i.e. v1.0, v20.15.10
      - 'vitto-plugin*' # Push events to matching vitto-plugin*, i.e. vitto-plugin@1.0.0
      - 'create-vitto*' # Push events to matching create-vitto*, i.e. create-vitto@1.0.0
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run workflow against'
        default: 'publish-npm'
        type: environment
        required: true

env:
  NODE_VERSION: 24
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

# Cancel in progress workflows on pull_requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-npm:
    # prevents this action from running on forks
    if: github.repository == 'riipandi/vitto'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to fetch the repository content
      id-token: write # Required for OIDC authentication to publish packages
      packages: write # Required to publish packages to GitHub Packages
    environment: publish-npm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          # disable cache, to avoid cache poisoning (https://docs.zizmor.sh/audits/#cache-poisoning)
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpmVersion }}
          run_install: |
            - args: [--global, npm@latest]

      - name: Check SDK versions
        shell: bash
        run: |
          echo "Node.js version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "pnpm version: $(pnpm -v)"

      - name: Extract version from tag
        id: version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Version from tag: $TAG_VERSION"

      - name: Check npm package versions
        id: check_versions
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"

          # Function to compare versions
          check_package() {
            local package=$1
            local current_version=$(npm view "$package" version 2>/dev/null || echo "0.0.0")
            echo "${package}_version=$current_version" >> $GITHUB_OUTPUT
            echo "Current $package version on npm: $current_version"

            if [ "$TAG_VERSION" = "$current_version" ]; then
              echo "❌ Version $TAG_VERSION already exists for $package"
              return 1
            fi
            return 0
          }

          # Check both packages
          can_publish=true
          check_package "vitto" || can_publish=false
          check_package "create-vitto" || can_publish=false

          if [ "$can_publish" = false ]; then
            exit 1
          fi

          echo "can_publish=true" >> $GITHUB_OUTPUT
          echo "✓ Version $TAG_VERSION is new and can be published"

      - name: Sync version across packages
        run: ./sync-version.sh "${{ steps.version.outputs.version }}"

      - name: Disallow installation scripts
        run: yq '.onlyBuiltDependencies = []' -i pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_ENV: production

      # This step not required when using OIDC authentication (Trusted Publisher)
      - name: Setup npm authentication
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish packages to npm
        if: steps.check_versions.outputs.can_publish == 'true'
        run: |
          # Publish vitto
          pnpm turbo publish:npm --filter=vitto
          echo "✓ Published vitto@${{ steps.version.outputs.version }}"

          # Publish create-vitto
          pnpm turbo publish:npm --filter=create-vitto
          echo "✓ Published create-vitto@${{ steps.version.outputs.version }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Determine if release is stable
        id: release_type
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
            echo "This is a stable release: $VERSION"
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "This is a pre-release: $VERSION"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true  # Automatically generate release notes from PRs and commits
          make_latest: ${{ steps.release_type.outputs.is_stable == 'true' }}
          body: |
            **Published to npm:**
            - [vitto@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/vitto/v/${{ steps.version.outputs.version }})
            - [create-vitto@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/create-vitto/v/${{ steps.version.outputs.version }})
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
