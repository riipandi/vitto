# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Publish workflow - Automatically publish packages to npm when a version tag is pushed
# Reference: https://docs.npmjs.com/trusted-publishers
#
# Usage:
#   1. Ensure all changes are committed
#   2. Set version and create tag:
#      VERSION="1.2.3" && git tag "v${VERSION}" && git push origin "v${VERSION}"
#
#   For pre-release versions:
#      VERSION="1.2.3-beta.1" && git tag "v${VERSION}" && git push origin "v${VERSION}"
#
#   To remove an existing tag:
#      VERSION="1.2.3" && git tag -d "v${VERSION}" && git push origin --delete "v${VERSION}"
#
# This workflow will:
#   - Extract version from the tag
#   - Check if version already exists on npm
#   - Sync version across all packages
#   - Build and publish to npm
#   - Create a GitHub release

name: Publish

on:
  push:
    tags:
      - 'v*.*.*' # Push events to matching v*, i.e. v1.0, v20.15.10
      - 'vitto-plugin*' # Push events to matching vitto-plugin*, i.e. vitto-plugin@1.0.0
      - 'create-vitto*' # Push events to matching create-vitto*, i.e. create-vitto@1.0.0
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run workflow against'
        default: 'publish-npm'
        type: environment
        required: true

env:
  NODE_VERSION: 24
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

# Cancel in progress workflows on pull_requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-npm:
    # prevents this action from running on forks
    if: github.repository == 'riipandi/vitto'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to fetch the repository content
      id-token: write # Required for OIDC authentication to publish packages
      packages: write # Required to publish packages to GitHub Packages
    environment: publish-npm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run actions/setup-sdk@local
        uses: ./.github/setup-sdk
        with:
          nodeVersion: ${{ env.NODE_VERSION }}

      - name: Disallow installation scripts
        run: yq '.onlyBuiltDependencies = []' -i pnpm-workspace.yaml

      - name: Setup npm authentication
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Check workflow environment
        run: |
          echo "Environment: $ENVIRONMENT"
          echo "Ref Name: $REF_NAME"
          echo "Running npm whoami:"
          npm whoami || true
          echo "Running pnpm whoami:"
          pnpm whoami || true
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}

      - if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Version from tag: $TAG_VERSION"

      - name: Check npm package versions
        id: check_versions
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"

          # Check vitto package
          VITTO_VERSION=$(npm view vitto version 2>/dev/null || echo "0.0.0")
          echo "vitto_version=$VITTO_VERSION" >> $GITHUB_OUTPUT
          echo "Current vitto version on npm: $VITTO_VERSION"

          # Check create-vitto package
          CREATE_VITTO_VERSION=$(npm view create-vitto version 2>/dev/null || echo "0.0.0")
          echo "create_vitto_version=$CREATE_VITTO_VERSION" >> $GITHUB_OUTPUT
          echo "Current create-vitto version on npm: $CREATE_VITTO_VERSION"

          # Compare versions
          if [ "$TAG_VERSION" = "$VITTO_VERSION" ] || [ "$TAG_VERSION" = "$CREATE_VITTO_VERSION" ]; then
            echo "❌ Version $TAG_VERSION already exists on npm"
            exit 1
          fi

          echo "can_publish=true" >> $GITHUB_OUTPUT
          echo "✓ Version $TAG_VERSION is new and can be published"

      - name: Sync version across packages
        run: |
          chmod +x ./sync-version.sh
          VERSION="${{ steps.version.outputs.version }}"
          echo "Extracted version: $VERSION"
          echo "Running sync-version.sh with version: $VERSION"
          ./sync-version.sh "$VERSION"

      - if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        name: Build the packages
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Publish vitto to npm
        if: steps.check_versions.outputs.can_publish == 'true'
        run: |
          pnpm turbo publish:npm --filter=vitto
          echo "✓ Successfully published vitto version ${{ steps.version.outputs.version }} to npm"
        env:
          REF_NAME: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-vitto to npm
        run: |
          pnpm turbo publish:npm --filter=create-vitto
          echo "✓ Successfully published create-vitto version ${{ steps.version.outputs.version }} to npm"
        env:
          REF_NAME: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## What's Changed

            **Published to npm:**
            - [vitto@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/vitto/v/${{ steps.version.outputs.version }})
            - [create-vitto@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/create-vitto/v/${{ steps.version.outputs.version }})
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
