# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: setup-sdk
description: Prepare development environment

inputs:
  nodeVersion:
    description: 'Specify Nodejs version'
    required: false
    default: '22'
  pnpmVersion:
    description: 'Specify pnpm version'
    required: false

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpmVersion }}
        run_install: |
          - args: [--global, npm@latest]

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.nodeVersion }}
        registry-url: 'https://registry.npmjs.org'
        # disable cache, to avoid cache poisoning (https://docs.zizmor.sh/audits/#cache-poisoning)
        package-manager-cache: false

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - uses: actions/cache@v4
      id: pnpm-cache
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-store-

    - name: Check SDK versions
      shell: bash
      run: |
        echo "Node.js version: $(node -v)"
        echo "npm version: $(npm -v)"
        echo "pnpm version: $(pnpm -v)"
